name: Build CodeShield ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-zip.yml'
      - 'zip/**'
  pull_request:
    paths:
      - '.github/workflows/build-zip.yml'
      - 'zip/**'

permissions:
  contents: read

jobs:
  package:
    name: Build plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Build CodeShield ZIP
        working-directory: zip
        run: gradle buildPlugin

      - name: Upload CodeShield ZIP
        uses: actions/upload-artifact@v4
        with:
          name: codeshield-zip
          path: zip/build/distributions/*.zip
          if-no-files-found: error
