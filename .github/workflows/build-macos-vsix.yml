name: Build macOS VSIX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-macos-vsix.yml'
      - '.github/workflows/package-platform.yml'
      - 'scripts/package_release.py'
      - 'README.md'
      - 'backend/**'
      - 'extension/**'
      - 'test/fixtures/**'
  pull_request:
    paths:
      - '.github/workflows/build-macos-vsix.yml'
      - '.github/workflows/package-platform.yml'
      - 'scripts/package_release.py'
      - 'README.md'
      - 'backend/**'
      - 'extension/**'
      - 'test/fixtures/**'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    uses: ./.github/workflows/package-platform.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
