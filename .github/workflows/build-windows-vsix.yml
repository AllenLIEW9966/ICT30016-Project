name: Build Windows VSIX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows-vsix.yml'
      - '.github/workflows/package-platform.yml'
      - 'scripts/package_release.py'
      - 'README.md'
      - 'backend/**'
      - 'extension/**'
      - 'test/fixtures/**'
  pull_request:
    paths:
      - '.github/workflows/build-windows-vsix.yml'
      - '.github/workflows/package-platform.yml'
      - 'scripts/package_release.py'
      - 'README.md'
      - 'backend/**'
      - 'extension/**'
      - 'test/fixtures/**'

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package-platform.yml
    with:
      runner: windows-latest
      target: win32-x64
